
name: Demo Project EC2 CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Verify JAR file
        run: |
          test -f target/demo_project-0.0.1-SNAPSHOT.jar
          echo "JAR file generated successfully"

      - name: Deploy JAR to EC2
        run: |
          install -m 644 \
            target/demo_project-0.0.1-SNAPSHOT.jar \
            /home/ec2-user/demo_project/app.jar.new

          mv /home/ec2-user/demo_project/app.jar.new \
             /home/ec2-user/demo_project/app.jar

      - name: Restart Spring Boot application
        run: |
          sudo /usr/bin/systemctl restart demo-project
          sleep 8
          sudo /usr/bin/systemctl is-active --quiet demo-project

      - name: Verify application
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/
          echo "Deployment successful!"

