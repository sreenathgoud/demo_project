
name: Full-Stack EC2 CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: ec2-fullstack-demo-jar
          path: target/ec2-fullstack-demo-*.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: ec2-fullstack-demo-jar
          path: artifact

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          JAR_FILE=$(find artifact -maxdepth 1 -type f -name '*.jar' | head -n 1)
          test -n "$JAR_FILE"

          # For a learning demo. In production, pin
          # the verified EC2 SSH host key instead.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/ec2_key "$JAR_FILE" \
            "$EC2_USER@$EC2_HOST:/opt/ec2-demo/app.jar.new"

      - name: Restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" '
            set -e
            mv /opt/ec2-demo/app.jar.new /opt/ec2-demo/app.jar
            sudo systemctl restart ec2-demo
            sleep 5
            sudo systemctl is-active --quiet ec2-demo
          '
